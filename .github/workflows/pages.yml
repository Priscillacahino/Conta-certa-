name: Publicar PWA no GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verificar aplicação
        run: npm run verify


  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar backend
        run: pip install -r requirements.txt
      - name: Gerar migrations e verificar modelos
        run: |
          python manage.py makemigrations core --check --dry-run
          python manage.py migrate --run-syncdb
      - name: Testar backend
        run: python manage.py test
  deploy:
    needs: [verify, backend-test]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Montar pacote público
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html instalar.html morador.html instalar-morador.html sincronizacao.html styles.css resident.css manifest.webmanifest manifest-morador.webmanifest sw.js _site/
          cp -R assets icons src _site/

      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4


