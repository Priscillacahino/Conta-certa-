<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conta Certa — Demonstração</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#071b30;color:white;font-family:Arial,sans-serif}
main{min-height:100vh;display:grid;place-items:center;padding:24px}
.player{width:min(1100px,100%);background:#0e2945;border-radius:22px;overflow:hidden;
box-shadow:0 28px 80px #0008}
.top{padding:20px 24px;background:#183153;display:flex;justify-content:space-between;gap:20px}
.top strong{font-size:22px}
.top span{opacity:.75}
.stage{position:relative;background:#edf3f8;aspect-ratio:1200/720}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .7s}
.slide.active{opacity:1}
.slide img{width:100%;height:100%;object-fit:contain}
.caption{padding:18px 24px;background:white;color:#183153}
.caption h2{margin:0 0 5px}
.caption p{margin:0;color:#5d6c80}
.controls{padding:14px 24px 22px;background:white;display:flex;align-items:center;gap:12px}
button{border:0;border-radius:10px;padding:10px 16px;background:#183153;color:white;font-weight:bold;cursor:pointer}
.track{height:7px;flex:1;background:#dfe7f1;border-radius:99px;overflow:hidden}
.progress{height:100%;width:0;background:#31805a}
a{color:#8bc4ff}
</style>
</head>
<body>
<main>
<div class="player">
<div class="top">
<div><strong>Conta Certa</strong><br><span>Gestão compartilhada, contas transparentes.</span></div>
<div>Demonstração curta</div>
</div>

<div class="stage">
<div class="slide active"><img src="assets/readme/visao-geral.svg"></div>
<div class="slide"><img src="assets/readme/caixa.svg"></div>
<div class="slide"><img src="assets/readme/obrigacoes.svg"></div>
<div class="slide"><img src="assets/readme/moradores.svg"></div>
</div>

<div class="caption">
<h2 id="caption-title">1. Visão geral</h2>
<p id="caption-text">Histórico, saldo, unidades e situação da base financeira em uma única visão.</p>
</div>

<div class="controls">
<button id="play">Pausar</button>
<div class="track"><div class="progress" id="progress"></div></div>
</div>
</div>
</main>

<script>
const data=[
["1. Visão geral","Histórico, saldo, unidades e situação da base financeira em uma única visão."],
["2. Caixa e fechamento","Receitas, despesas, fechamento mensal, saldo transportado e prestação de contas."],
["3. Obrigações","Mensalidades, taxas extraordinárias, pagamentos e pendências controlados por unidade."],
["4. Morador","Consulta separada e somente leitura, com proteção dos dados das demais unidades."]
];

const slides=[...document.querySelectorAll(".slide")];
const title=document.querySelector("#caption-title");
const text=document.querySelector("#caption-text");
const progress=document.querySelector("#progress");
const button=document.querySelector("#play");

let current=0;
let playing=true;
let start=Date.now();
const duration=4000;

function show(index){
slides.forEach((s,i)=>s.classList.toggle("active",i===index));
title.textContent=data[index][0];
text.textContent=data[index][1];
start=Date.now();
}

function tick(){
if(playing){
const elapsed=Date.now()-start;
progress.style.width=Math.min(100,elapsed/duration*100)+"%";
if(elapsed>=duration){
current=(current+1)%slides.length;
show(current);
}
}
requestAnimationFrame(tick);
}

button.addEventListener("click",()=>{
playing=!playing;
button.textContent=playing?"Pausar":"Reproduzir";
if(playing)start=Date.now();
});

show(0);
tick();
</script>
</body>
</html>
